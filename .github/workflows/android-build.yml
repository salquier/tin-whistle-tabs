name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Synchronize master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch origin master
          git checkout -B master origin/master

      - name: Determine build version
        id: version
        shell: bash
        run: |
          BUILD_FILE="Irish_Whistle/app/build.gradle"
          CURRENT_VERSION="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' "$BUILD_FILE")"
          CURRENT_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' "$BUILD_FILE")"

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported versionName: $CURRENT_VERSION" >&2
            exit 1
          fi

          NEXT_VERSION="$CURRENT_VERSION"
          NEXT_CODE="$CURRENT_CODE"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            NEXT_CODE="$((CURRENT_CODE + 1))"
            sed -i "s/versionName \"$CURRENT_VERSION\"/versionName \"$NEXT_VERSION\"/" "$BUILD_FILE"
            sed -i "s/versionCode $CURRENT_CODE/versionCode $NEXT_CODE/" "$BUILD_FILE"
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Irish_Whistle/*.gradle
            Irish_Whistle/gradle/wrapper/gradle-wrapper.properties
            Irish_Whistle/app/*.gradle

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-33" "build-tools;30.0.3"

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" ]]; then
            # Published APKs must always use the same key, otherwise they cannot update the app
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
              echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret: releases must be signed with the stable key" >&2
              exit 1
            fi
            echo "::warning::No signing secrets: this APK uses the debug key and cannot update an installed app"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: Irish_Whistle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        working-directory: Irish_Whistle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp Irish_Whistle/app/build/outputs/apk/release/app-release.apk             "TinWhistleTabs-${{ steps.version.outputs.version }}.apk"

      - name: Commit version increment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Irish_Whistle/app/build.gradle
          git commit -m "build: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin master

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tin-whistle-tabs-${{ steps.version.outputs.version }}-apk
          path: TinWhistleTabs-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: master
          body: |
            APK for version `${{ steps.version.outputs.version }}`.
          prerelease: false
          make_latest: true
          files: TinWhistleTabs-${{ steps.version.outputs.version }}.apk
